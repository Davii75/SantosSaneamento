<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Barra lateral azul usada em todas as telas.
  Uso: <div th:replace="~{fragments/layout :: sidebar('registro')}"></div>
  O parâmetro "ativo" diz qual item fica destacado.
  Os itens mudam conforme o perfil do usuário logado (${usuario.perfil}).
-->
<th:block th:fragment="sidebar(ativo)">

  <button class="menu-toggle mobile-only" type="button" id="menuToggle" aria-label="Abrir menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <button class="mobile-overlay mobile-only" type="button" id="menuOverlay" aria-label="Fechar menu" hidden></button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="logo">
        <img alt="" class="logo-mark" th:src="@{/images/logo-santos-saneia.svg}"/>
        <strong>Santos Saneia</strong>
      </div>
    </div>

    <nav class="nav">
      <span class="nav-label">NAVEGAÇÃO</span>

      <!-- CIDADÃO -->
      <th:block th:if="${usuario != null and usuario.perfil == 'cidadao'}">
        <a class="nav-item" th:classappend="${ativo == 'registro'} ? 'active'" th:href="@{/chamados/novo}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Novo chamado
        </a>
        <a class="nav-item" th:classappend="${ativo == 'acompanhamento'} ? 'active'" th:href="@{/cidadao/chamados}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
          Meus chamados
        </a>
      </th:block>

      <!-- PREFEITURA -->
      <th:block th:if="${usuario != null and usuario.perfil == 'prefeitura'}">
        <a class="nav-item" th:classappend="${ativo == 'painel'} ? 'active'" th:href="@{/prefeitura/painel}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          Painel gerencial
        </a>
        <a class="nav-item" th:classappend="${ativo == 'lista'} ? 'active'" th:href="@{/prefeitura/chamados}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
          Todas as ocorrências
        </a>
      </th:block>

      <!-- SABESP -->
      <th:block th:if="${usuario != null and usuario.perfil == 'sabesp'}">
        <a class="nav-item" th:classappend="${ativo == 'lista'} ? 'active'" th:href="@{/sabesp/chamados}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
          Fila de atendimento
        </a>
      </th:block>
    </nav>

    <div class="sidebar-service">
      <span class="service-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
      </span>
      <strong>Canal oficial</strong>
      <p>Serviço integrado à Prefeitura de Santos e à Sabesp.</p>
    </div>

    <a class="profile" th:href="@{/sair}" title="Sair do sistema">
      <span class="avatar" th:text="${usuario != null ? usuario.iniciais : '?'}">MO</span>
      <span>
        <strong th:text="${usuario != null ? usuario.nome : 'Visitante'}">Marina Oliveira</strong>
        <small th:text="${usuario != null ? usuario.cargo : ''}">Cidadã</small>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </a>
  </aside>

  <script>
    (function () {
      var sidebar = document.getElementById('sidebar');
      var overlay = document.getElementById('menuOverlay');
      var toggle = document.getElementById('menuToggle');
      function setOpen(open) {
        sidebar.classList.toggle('sidebar-open', open);
        overlay.hidden = !open;
      }
      toggle.addEventListener('click', function () { setOpen(true); });
      overlay.addEventListener('click', function () { setOpen(false); });
    })();
  </script>
</th:block>

</body>
</html>
