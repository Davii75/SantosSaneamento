spring.application.name=chamados

# Banco H2 em memória (os dados voltam ao início quando a aplicação reinicia)
spring.datasource.url=jdbc:h2:mem:chamadosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Para acessar o H2:
# URL: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:chamadosdb
# User: sa
# Password: deixe em branco

# Upload da foto do chamado (JPG/PNG até 5 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

spring.thymeleaf.cache=false

