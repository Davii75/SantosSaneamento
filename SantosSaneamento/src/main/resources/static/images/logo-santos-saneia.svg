<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Santos Saneia">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a5fc9"/>
      <stop offset="1" stop-color="#0049a8"/>
    </linearGradient>
    <!-- gota: ponta em cima, base redonda -->
    <path id="gota" d="M24 3.5C24 3.5 9 20.2 9 30.2a15 15 0 0 0 30 0C39 20.2 24 3.5 24 3.5Z"/>
    <!-- abre um respiro na gota grande, ao redor da pequena -->
    <mask id="respiro" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g transform="translate(17.54 20.61) scale(.34)">
        <use href="#gota" fill="#000" stroke="#000" stroke-width="21" stroke-linejoin="round"/>
      </g>
    </mask>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fundo)"/>

  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- gota grande (com brilho), recortada perto da pequena -->
    <g transform="translate(23.46 18.74) scale(.56)" mask="url(#respiro)">
      <use href="#gota" stroke-width="4.8"/>
      <path d="M33.2 28.6A9.3 9.3 0 0 1 22.8 39.4" stroke-width="4.8"/>
    </g>
    <!-- gota pequena -->
    <g transform="translate(17.54 20.61) scale(.34)">
      <use href="#gota" stroke-width="6.6"/>
    </g>
  </g>
</svg>
