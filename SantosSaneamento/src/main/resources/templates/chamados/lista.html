<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Fila de atendimento | Santos Saneia
  </title>
  <link rel="icon" th:href="@{/images/logo-santos-saneia.svg}" type="image/svg+xml">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/lista.css}">
  <script defer="" th:src="@{/js/lista.js}">
  </script>
 </head>
 <body>
  <div class="app-shell">
   <div th:replace="~{fragments/layout :: sidebar('lista')}">
   </div>
   <div class="main">
    <header class="topbar">
     <div>
      <h1 th:text="${perfil == 'prefeitura' ? 'Ocorrências do município' : 'Fila de atendimento'}">
       Fila de atendimento
      </h1>
      <p th:text="${perfil == 'prefeitura' ? 'Consulte e fiscalize o andamento dos chamados em toda a cidade.' : 'Analise, atualize e conclua as solicitações enviadas pelos cidadãos.'}">
       Descrição
      </p>
     </div>
     <div class="top-actions">
      <span class="header-avatar" th:text="${usuario.iniciais}">
       MS
      </span>
     </div>
    </header>
    <div class="content">
     <div class="alert-ok" th:if="${sucesso != null}" th:text="'✓ ' + ${sucesso}">
     </div>
     <div class="stats-row compact">
      <div class="card stat-card">
       <span class="stat-icon tone-blue">
        ◷
       </span>
       <div>
        <span>
         Aguardando análise
        </span>
        <strong th:text="${novos}">
         12
        </strong>
       </div>
      </div>
      <div class="card stat-card">
       <span class="stat-icon tone-orange">
        ⚠
       </span>
       <div>
        <span>
         Em atendimento
        </span>
        <strong th:text="${atendimento}">
         08
        </strong>
       </div>
      </div>
      <div class="card stat-card">
       <span class="stat-icon tone-green">
        ✓
       </span>
       <div>
        <span>
         Resolvidos
        </span>
        <strong th:text="${resolvidos}">
         47
        </strong>
       </div>
      </div>
      <div class="card stat-card">
       <span class="stat-icon tone-purple">
        ▦
       </span>
       <div>
        <span>
         Total de chamados
        </span>
        <strong th:text="${total}">
         68
        </strong>
       </div>
      </div>
     </div>
     <div class="card list-card">
      <!-- Filtros: enviados por GET e aplicados no servidor (ChamadoService.filtrar) -->
      <form class="table-tools" id="filtros" method="get" th:action="@{/chamados}">
       <!-- Linha 1: barra de pesquisa ocupando toda a largura -->
       <div class="search-box">
        <button aria-label="Buscar" class="search-submit" type="submit">
         <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.9-4.9"/></svg>
        </button>
        <input aria-label="Buscar chamados" class="control" name="busca" placeholder="Buscar por protocolo, endereço ou bairro..." th:value="${busca}" type="search"/>
       </div>
       <!-- Linha 2: filtros e botão, na mesma grade da barra de cima -->
       <div class="filters-row">
        <select aria-label="Filtrar por status" class="control" name="status">
         <option value="">
          Todos os status
         </option>
         <option th:each="s : ${statusLista}" th:selected="${s == statusSel}" th:text="${s}" th:value="${s}">
         </option>
        </select>
        <select aria-label="Filtrar por bairro" class="control" name="bairro">
         <option value="">
          Todos os bairros
         </option>
         <option th:each="b : ${bairros}" th:selected="${b == bairroSel}" th:text="${b}" th:value="${b}">
         </option>
        </select>
        <select aria-label="Filtrar por tipo" class="control" name="tipo">
         <option value="">
          Todos os tipos
         </option>
         <option th:each="t : ${tipos}" th:selected="${t == tipoSel}" th:text="${t}" th:value="${t}">
         </option>
        </select>
        <a class="btn btn-secondary btn-limpar" th:href="@{/chamados}">
         Limpar
        </a>
       </div>
      </form>
      <div class="table-wrap">
       <table>
        <thead>
         <tr>
          <th>
           Protocolo
          </th>
          <th>
           Ocorrência
          </th>
          <th>
           Localização
          </th>
          <th>
           Data
          </th>
          <th>
           Status
          </th>
         </tr>
        </thead>
        <tbody id="callsTable">
         <tr class="linha-clicavel" th:data-href="@{/chamados/detalhes/{id}(id=${chamado.id})}" th:each="chamado : ${chamados}">
          <td>
           <a class="protocol-link" th:href="@{/chamados/detalhes/{id}(id=${chamado.id})}" th:text="${'#CH-' + chamado.id}">
            #CH-1048
           </a>
          </td>
          <td>
           <strong th:text="${chamado.tipo}">
            Vazamento
           </strong>
           <small th:text="${chamado.solicitante}">
            Solicitante
           </small>
          </td>
          <td>
           <strong th:text="${chamado.bairro}">
            Boqueirão
           </strong>
           <small th:text="${chamado.endereco}">
            Endereço
           </small>
          </td>
          <td>
           <strong th:text="${#temporals.format(chamado.dataHora,'dd/MM/yyyy')}">
            23/05/2025
           </strong>
           <small th:text="${#temporals.format(chamado.dataHora,'HH:mm')}">
            09:42
           </small>
          </td>
          <td>
           <span class="badge" th:classappend="${chamado.statusClasse}" th:text="${chamado.status}">
            Novo
           </span>
          </td>
         </tr>
         <tr th:if="${#lists.isEmpty(chamados)}">
          <td class="text-center" colspan="5" style="text-align:center;color:var(--muted)">
           Nenhum chamado encontrado.
          </td>
         </tr>
        </tbody>
       </table>
      </div>
      <div class="table-footer">
       <span th:text="${'Mostrando ' + #lists.size(chamados) + ' de ' + total + ' chamado(s)'}">
        Chamados cadastrados
       </span>
      </div>
     </div>
    </div>
   </div>
  </div>
 </body>
</html>
